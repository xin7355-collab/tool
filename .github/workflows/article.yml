name: 網頁文章轉存

# 前端「文章」分頁會把網址寫進 article-inbox/，這裡抓成純文字後，
# 走跟逐字稿一模一樣的產線（摘要／分類／打包下載），所以網站不用改。

on:
  push:
    branches: [main]
    paths:
      - 'article-inbox/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝抓取工具
        run: |
          # trafilatura 不需要瀏覽器，一般文章頁這樣就抓得到，裝起來也快。
          # crawl4ai（要 Chromium）只有在設了 USE_CRAWL4AI 時才裝。
          pip install --no-cache-dir trafilatura
          if [ "${{ vars.USE_CRAWL4AI }}" = "1" ]; then
            pip install --no-cache-dir crawl4ai
            python -m playwright install --with-deps chromium
          fi
      - name: 取回已發佈的內容
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch gh-pages "$URL" site 2>/dev/null || {
            mkdir -p site && cd site && git init -q -b gh-pages && git remote add origin "$URL" && cd ..; }
          mkdir -p site/transcripts
      - name: 抓文章
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_LLM_MODEL: ${{ vars.GROQ_LLM_MODEL || 'llama-3.1-8b-instant' }}
          GROQ_SUMMARY: ${{ vars.GROQ_SUMMARY || '1' }}
          DECK_CATEGORIES: ${{ vars.DECK_CATEGORIES }}
        run: |
          ls -l article-inbox/ 2>/dev/null || echo "(inbox 是空的)"
          python scripts/fetch_article.py
      - name: 發佈到 gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if ! ls out/*.md >/dev/null 2>&1; then echo "沒有新產出"; exit 0; fi
          for f in out/*.md out/*.txt; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in _*) continue;; esac
            cp "$f" site/transcripts/
          done
          python scripts/build_index.py site/transcripts
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish articles" || { echo "no change"; exit 0; }
          for k in 1 2 3 4 5; do
            git push origin HEAD:gh-pages && exit 0
            echo "push race, retry $k"; sleep 3
            git fetch origin gh-pages && git merge -X ours origin/gh-pages -m "merge gh-pages" || true
          done
          exit 1
      - name: 清掉已處理的網址清單
        if: always()
        run: |
          [ -s out/_processed.txt ] || exit 0
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"
          done < out/_processed.txt
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clear processed article list [skip ci]" || exit 0
          for k in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main || true; sleep 3
          done
